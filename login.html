<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login - CropVault</title>
  <style>
    :root{--bg:#ffffff;--bg-alt:#f6fdf6;--surface:#ffffff;--surface-hover:#f0fdf4;--text:#0a0a0a;--text-muted:#525252;--accent:#16a34a;--accent-hover:#15803d;--accent-glow:rgba(22,163,74,0.15);--border:#e5e7eb;--shadow:0 4px 6px -1px rgba(0,0,0,0.05);--radius:12px;--transition:all 0.3s cubic-bezier(0.4,0,0.2,1)}
    [data-theme="dark"]{--bg:#000000;--bg-alt:#050a05;--surface:#0a0a0a;--surface-hover:#052e16;--text:#ffffff;--text-muted:#a3a3a3;--accent:#22c55e;--accent-hover:#16a34a;--accent-glow:rgba(34,197,94,0.15);--border:#1a1a1a;--shadow:0 4px 6px -1px rgba(0,0,0,0.5)}
    *{margin:0;padding:0;box-sizing:border-box}
    body{font-family:'Segoe UI',system-ui,sans-serif;background:var(--bg);color:var(--text);line-height:1.6;transition:var(--transition);min-height:100vh}
    .top-nav{position:fixed;top:0;left:0;right:0;display:flex;align-items:center;justify-content:space-between;padding:1rem 2rem;background:rgba(var(--bg),0.8);backdrop-filter:blur(12px);border-bottom:1px solid var(--border);z-index:1000}
    .nav-left{display:flex;align-items:center;gap:1.5rem}
    .logo{font-size:1.5rem;font-weight:800;color:var(--accent);text-decoration:none;display:flex;align-items:center;gap:0.5rem}
    .nav-links{display:flex;gap:1rem;list-style:none}
    .nav-links a{color:var(--text-muted);text-decoration:none;font-weight:500;font-size:0.9rem;padding:0.5rem 1rem;border-radius:var(--radius);transition:var(--transition)}
    .nav-links a:hover{color:var(--accent);background:var(--accent-glow)}
    .nav-right{display:flex;align-items:center;gap:1rem}
    .theme-toggle{background:none;border:1px solid var(--border);color:var(--text);width:40px;height:40px;border-radius:50%;cursor:pointer;display:flex;align-items:center;justify-content:center;font-size:1.1rem}
    .theme-toggle:hover{border-color:var(--accent);color:var(--accent)}
    .btn{display:inline-flex;align-items:center;justify-content:center;gap:0.5rem;padding:0.75rem 1.5rem;border-radius:var(--radius);font-weight:600;font-size:0.95rem;cursor:pointer;transition:var(--transition);border:none;text-decoration:none}
    .btn-primary{background:var(--accent);color:white}
    .btn-primary:hover{background:var(--accent-hover);transform:translateY(-2px);box-shadow:0 10px 25px -5px var(--accent-glow)}
    .btn-outline{background:transparent;color:var(--text);border:1.5px solid var(--border)}
    .btn-outline:hover{border-color:var(--accent);color:var(--accent);background:var(--accent-glow)}
    .auth-page{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:2rem;background:var(--bg-alt)}
    .auth-container{width:100%;max-width:420px;background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:2.5rem;box-shadow:var(--shadow)}
    .auth-header{text-align:center;margin-bottom:2rem}
    .auth-header h1{font-size:1.75rem;margin-bottom:0.5rem}
    .auth-header p{color:var(--text-muted);font-size:0.95rem}
    .form-group{margin-bottom:1.25rem}
    .form-group label{display:block;margin-bottom:0.5rem;font-weight:500;font-size:0.9rem}
    .form-group input{width:100%;padding:0.875rem 1rem;border:1.5px solid var(--border);border-radius:var(--radius);background:var(--bg);color:var(--text);font-size:0.95rem;transition:var(--transition)}
    .form-group input:focus{outline:none;border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-glow)}
    .form-group input::placeholder{color:var(--text-muted)}
    .forgot-link{display:block;text-align:right;margin-top:-0.5rem;margin-bottom:1.5rem;font-size:0.85rem;color:var(--accent);text-decoration:none}
    .forgot-link:hover{text-decoration:underline}
    .auth-footer{text-align:center;margin-top:1.5rem;color:var(--text-muted);font-size:0.9rem}
    .auth-footer a{color:var(--accent);text-decoration:none;font-weight:600}
    .error-msg{background:#fef2f2;color:#dc2626;padding:0.75rem;border-radius:var(--radius);font-size:0.85rem;margin-bottom:1rem;display:none}
    [data-theme="dark"] .error-msg{background:#450a0a;color:#fca5a5}
    .modal-overlay{position:fixed;inset:0;background:rgba(0,0,0,0.7);backdrop-filter:blur(4px);display:none;align-items:center;justify-content:center;z-index:2000;opacity:0;transition:opacity 0.3s;padding:2rem}
    .modal-overlay.active{display:flex;opacity:1}
    .modal{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);width:100%;max-width:420px;box-shadow:0 25px 50px -12px rgba(0,0,0,0.5);transform:scale(0.95);transition:transform 0.3s}
    .modal-overlay.active .modal{transform:scale(1)}
    .modal-header{display:flex;align-items:center;justify-content:space-between;padding:1.5rem;border-bottom:1px solid var(--border)}
    .modal-header h2{font-size:1.25rem}
    .modal-close{background:none;border:none;color:var(--text-muted);font-size:1.5rem;cursor:pointer;width:36px;height:36px;display:flex;align-items:center;justify-content:center;border-radius:50%}
    .modal-close:hover{background:var(--surface-hover);color:var(--text)}
    .modal-body{padding:1.5rem}
    .modal-footer{padding:1rem 1.5rem;border-top:1px solid var(--border);display:flex;justify-content:flex-end;gap:0.75rem}
    .toast{position:fixed;bottom:2rem;right:2rem;background:var(--accent);color:white;padding:1rem 1.5rem;border-radius:var(--radius);font-weight:500;box-shadow:0 10px 15px -3px var(--accent-glow);transform:translateY(100px);opacity:0;transition:all 0.3s;z-index:3000}
    .toast.show{transform:translateY(0);opacity:1}
    @keyframes fadeInUp{from{opacity:0;transform:translateY(20px)}to{opacity:1;transform:translateY(0)}}
    .animate-in{animation:fadeInUp 0.6s ease forwards}
    @media(max-width:768px){.top-nav{padding:1rem}.nav-links{display:none}}
  </style>
</head>
<body>
  <nav class="top-nav">
    <div class="nav-left">
      <a href="index.html" class="logo">🌾 CropVault</a>
      <ul class="nav-links">
        <li><a href="login.html">Login</a></li>
        <li><a href="signup.html">Sign Up</a></li>
      </ul>
    </div>
    <div class="nav-right">
      <button class="theme-toggle" onclick="toggleTheme()">🌙</button>
    </div>
  </nav>

  <div class="auth-page">
    <div class="auth-container animate-in">
      <div class="auth-header">
        <h1>Welcome Back</h1>
        <p>Sign in to access your CropVault dashboard</p>
      </div>
      <div class="error-msg" id="error"></div>
      <form id="loginForm">
        <div class="form-group">
          <label for="email">Email Address</label>
          <input type="email" id="email" placeholder="farmer@example.com" required>
        </div>
        <div class="form-group">
          <label for="password">Password</label>
          <input type="password" id="password" placeholder="••••••••" required>
        </div>
        <a href="javascript:void(0)" class="forgot-link" onclick="openModal('forgotModal')">Forgot password?</a>
        <button type="submit" class="btn btn-primary" style="width:100%">Sign In</button>
      </form>
      <div class="auth-footer">Don't have an account? <a href="signup.html">Sign up</a></div>
    </div>
  </div>

  <div class="modal-overlay" id="forgotModal">
    <div class="modal">
      <div class="modal-header"><h2>Reset Password</h2><button class="modal-close" onclick="closeModal('forgotModal')">&times;</button></div>
      <div class="modal-body">
        <p style="color:var(--text-muted);margin-bottom:1rem">Enter your email and we'll send you a reset link.</p>
        <div class="form-group"><label>Email Address</label><input type="email" id="forgotEmail" placeholder="farmer@example.com"></div>
      </div>
      <div class="modal-footer">
        <button class="btn btn-outline" onclick="closeModal('forgotModal')">Cancel</button>
        <button class="btn btn-primary" onclick="sendReset()">Send Reset Link</button>
      </div>
    </div>
  </div>

  <script>
    const ADMIN_EMAIL='sunshine@schools.com',ADMIN_PASSWORD='sunshine schools';
    const getUsers=()=>{try{return JSON.parse(localStorage.getItem('cropvault-users')||'[]')}catch{return[]}};
    const getCurrentUser=()=>{try{return JSON.parse(localStorage.getItem('cropvault-current')||'null')}catch{return null}};
    const login=(email,password)=>{if(email.toLowerCase()===ADMIN_EMAIL&&password===ADMIN_PASSWORD){const a={name:'Administrator',email:ADMIN_EMAIL,isAdmin:true};localStorage.setItem('cropvault-current',JSON.stringify(a));return{success:true,user:a,isAdmin:true}}const u=getUsers();const f=u.find(x=>x.email.toLowerCase()===email.toLowerCase()&&x.password===password);if(!f)return{success:false,error:'Invalid email or password'};localStorage.setItem('cropvault-current',JSON.stringify(f));return{success:true,user:f}};
    const initTheme=()=>{const s=localStorage.getItem('cropvault-theme')||(window.matchMedia('(prefers-color-scheme:dark)').matches?'dark':'light');document.documentElement.setAttribute('data-theme',s);document.querySelector('.theme-toggle').textContent=s==='dark'?'☀️':'🌙'};
    const toggleTheme=()=>{const c=document.documentElement.getAttribute('data-theme');const n=c==='dark'?'light':'dark';document.documentElement.setAttribute('data-theme',n);localStorage.setItem('cropvault-theme',n);document.querySelector('.theme-toggle').textContent=n==='dark'?'☀️':'🌙'};
    const openModal=(id)=>document.getElementById(id).classList.add('active');
    const closeModal=(id)=>document.getElementById(id).classList.remove('active');
    const showToast=(msg)=>{const t=document.createElement('div');t.className='toast';t.textContent=msg;document.body.appendChild(t);requestAnimationFrame(()=>t.classList.add('show'));setTimeout(()=>{t.classList.remove('show');setTimeout(()=>t.remove(),300)},3000)};
    document.addEventListener('DOMContentLoaded',()=>{initTheme();document.querySelectorAll('.modal-overlay').forEach(o=>o.addEventListener('click',e=>{if(e.target===o)o.classList.remove('active')}))});
    document.getElementById('loginForm').addEventListener('submit',e=>{e.preventDefault();const em=document.getElementById('email').value.trim();const pw=document.getElementById('password').value;const err=document.getElementById('error');const r=login(em,pw);if(r.success){window.location.href=r.isAdmin?'admin.html':'dashboard.html'}else{err.textContent=r.error;err.style.display='block'}});
    function sendReset(){const em=document.getElementById('forgotEmail').value.trim();if(!em){showToast('Please enter your email');return}closeModal('forgotModal');document.getElementById('forgotEmail').value='';showToast('Reset link sent to '+em)}
  </script>
</body>
</html>
